name: Browser smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, MIT
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0, MIT
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: ./node_modules/.bin/playwright test --workers=2

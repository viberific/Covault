name: Build React Capacitor Android App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual "Run workflow" button in Actions tab

permissions:
  contents: read

# Cancel older builds on the same branch if a new one is started
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, MIT

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0, MIT
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # Retried for the same reason the Gradle step is: a build has already
        # been lost to a dropped TLS connection midway through this, which is
        # the registry having a bad moment rather than anything to fix here.
        run: |
          for attempt in 1 2 3; do
            npm ci --legacy-peer-deps && break
            if [ "$attempt" = 3 ]; then
              echo "npm ci failed three times — not a network blip."
              exit 1
            fi
            echo "npm attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done

      - name: Type-check and run unit tests
        run: |
          npm run check:structure
          npm run typecheck
          npm run typecheck:unused
          npm run lint
          npm test

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_PUBLIC_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Error reporting. Absent until the secret is added, and the app is
          # built with reporting switched off rather than broken — see
          # app/lib/observability/errorReporting.ts.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # The run number is already the versionCode and the release tag; this
          # makes it the reporter's release identity too, so a crash can be
          # traced to the build that introduced it.
          VITE_BUILD_NUMBER: ${{ github.run_number }}

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.0.1, MIT
        with:
          distribution: 'temurin'
          java-version: '21'

      # `packages` is spelled out because the action's default is
      # "tools platform-tools", and Google has withdrawn the legacy `tools`
      # package: sdkmanager now answers "Failed to find package 'tools'" and
      # exits 1, which failed every build at this step from 2026-09-24 on.
      # Nothing here uses `tools` — Gradle brings its own build tools and
      # platforms, and apksigner comes from build-tools.
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4, MIT
        with:
          packages: platform-tools

      - name: Setup Capacitor and Android
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      # Gradle, and everything Gradle downloads, kept between runs.
      #
      # Two builds in a row have died here on GitHub's own servers rather than
      # on anything in this repo — one on a 504 fetching the Gradle
      # distribution itself, one on a dropped connection pulling npm packages —
      # so this is about not needing the network, not about speed.
      #
      # It has to come AFTER the android/ directory is generated: that folder
      # is deleted and rebuilt by `npx cap add android` on every run, so the
      # wrapper properties this key is built from do not exist until then. The
      # key changes when the Gradle version does, which is what stops a stale
      # distribution being reused after an upgrade.
      - name: Cache Gradle and its downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, MIT
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Sync custom Android files (icons, Java, manifest)
        run: bash scripts/sync-android.sh

      - name: Add biometric auth dependency to Android
        run: |
          cd android/app
          sed -i '/dependencies {/a\    implementation "androidx.biometric:biometric:1.1.0"' build.gradle

      # The phone will only install a new APK over the old one when both are
      # signed by the same key. Gradle mints a throwaway key when it can't find
      # one, and this runner is fresh every time — which is why an update used
      # to demand an uninstall first, taking the app's local data with it.
      #
      # The signing config is written into the Gradle build explicitly rather
      # than by dropping a file where Gradle is expected to look for it. That
      # was the first attempt and it silently did nothing: the build was green,
      # the step said "success", and three consecutive releases went out under
      # three different keys. Where the toolchain resolves its default debug
      # keystore depends on environment variables the runner controls, so it is
      # not something to depend on — naming the file is.
      #
      # The committed key is a debug key for a public repository whose APK is
      # public anyway, so it protects nothing worth protecting. Setting the
      # ANDROID_DEBUG_KEYSTORE_BASE64 secret overrides it and keeps the key
      # private; switching costs exactly one more uninstall, once.
      - name: Pin the app signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE="$RUNNER_TEMP/covault-signing.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using the signing key from repository secrets."
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          else
            echo "Using the committed debug signing key."
            cp native/android/covault-debug.keystore "$KEYSTORE"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE" >> $GITHUB_ENV

          cat >> android/app/build.gradle <<GRADLE

          // Appended by .github/workflows/build-android.yml.
          android {
              signingConfigs {
                  debug {
                      storeFile file("$KEYSTORE")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE

      # The run number is the app's versionCode, and the release is tagged with
      # the same integer — that shared number is the whole of the update check.
      # It has to be stamped here because android/ is regenerated each run.
      - name: Stamp the build number into the APK
        run: |
          cd android/app
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \".*\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle
          # If Capacitor ever changes the shape of this file the sed above
          # matches nothing, every build ships as versionCode 1, and the app
          # quietly stops seeing updates. Fail here instead.
          grep -q "versionCode ${{ github.run_number }}" build.gradle

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x ./gradlew
          # Three attempts, because the failure this guards is a transient
          # 504 or a dropped connection while Gradle fetches something — not a
          # broken build. A real compile error fails all three in seconds and
          # still fails the run, so this cannot hide one.
          for attempt in 1 2 3; do
            ./gradlew assembleDebug && break
            if [ "$attempt" = 3 ]; then
              echo "Gradle failed three times — this is not a network blip."
              exit 1
            fi
            echo "Gradle attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done

      # The web layer, publishable on its own. Almost every change here is
      # React rather than Java, and the app can replace this without being
      # reinstalled — see app/hooks/useAppUpdate.ts.
      #
      # The native fingerprint is in the filename because that is the one place
      # it cannot drift from the bundle it describes. A phone applies only the
      # bundle carrying its own fingerprint, so the moment anything native
      # changes, no bundle matches and the update becomes a normal APK install.
      - name: Package the web bundle
        run: |
          NATIVE_HASH="$(node scripts/native-hash.mjs)"
          test -n "$NATIVE_HASH"
          test -f dist/index.html
          WEB_BUNDLE="covault-web-${NATIVE_HASH}.zip"
          # Source maps stay out of the bundle phones download. They are about
          # three quarters of it (2.8 MB zipped with them, 0.65 MB without),
          # the WebView never fetches them unless DevTools is attached, and
          # the APK still carries its own copy for on-device debugging.
          (cd dist && zip -qr "../${WEB_BUNDLE}" . -x '*.map')
          echo "WEB_BUNDLE=${WEB_BUNDLE}" >> $GITHUB_ENV
          ls -lh "${WEB_BUNDLE}"

      # Prove the pinned key was actually used, rather than assuming it.
      #
      # This exists because the previous approach failed silently and shipped
      # three uninstallable updates before anyone could tell. An APK signed
      # with the wrong key is not a broken build — it builds perfectly, and
      # then refuses to install on the one phone that matters. Failing here
      # costs a red run; not failing here costs a manual uninstall and the
      # app's local data.
      - name: Verify the APK carries the pinned signature
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found — cannot prove which key signed this APK."
            exit 1
          fi

          EXPECTED="$(keytool -exportcert -keystore "$KEYSTORE_PATH" \
            -alias androiddebugkey -storepass android 2>/dev/null \
            | openssl dgst -sha256 | awk '{print $NF}')"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -i 'certificate SHA-256 digest' | head -1 | awk '{print $NF}')"

          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "This APK is NOT signed with the pinned key. It would fail to"
            echo "install over the existing app, and the only way out would be"
            echo "uninstalling — which erases the app's local data."
            exit 1
          fi
          echo "Signature matches the pinned key."

      - name: Rename APK with timestamp
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Covault-${TIMESTAMP}.apk
          echo "APK_NAME=Covault-${TIMESTAMP}.apk" >> $GITHUB_ENV

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1, MIT
        with:
          name: ${{ env.APK_NAME }}
          path: android/app/build/outputs/apk/debug/Covault-*.apk
          retention-days: 14
          compression-level: 0

      - name: Share release files with the publisher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1, MIT
        with:
          name: covault-release-assets
          path: |
            android/app/build/outputs/apk/debug/Covault-*.apk
            ${{ env.WEB_BUNDLE }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish-release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code for release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, MIT
        with:
          ref: ${{ github.sha }}

      - name: Download validated release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.1, MIT
        with:
          name: covault-release-assets
          path: release-assets

      # Only this job can publish a public release. The build and validation
      # job keeps read-only repository access, including on pull requests.
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(find release-assets -type f -name 'Covault-*.apk' -print -quit)"
          WEB_BUNDLE="$(find release-assets -type f -name 'covault-web-*.zip' -print -quit)"
          if [ -z "$APK" ] || [ -z "$WEB_BUNDLE" ]; then
            echo "The validated APK and web bundle were not both found."
            exit 1
          fi

          # The release body is what the update pill shows as "what changed",
          # so it is the commit subject rather than a generated changelog.
          NOTES="$(git log -1 --pretty=%s)"
          TAG="v${{ github.run_number }}"
          # Re-running a workflow reuses its run number, so the tag may already
          # exist. Replacing the asset is the right answer there; failing the
          # build over it is not.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$WEB_BUNDLE" --clobber
          else
            gh release create "$TAG" "$APK" "$WEB_BUNDLE" \
              --title "Covault 1.0.${{ github.run_number }}" \
              --notes "$NOTES" \
              --latest
          fi
